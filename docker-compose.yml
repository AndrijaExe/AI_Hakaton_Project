services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: community_day
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - mailpit
    environment:
      DATABASE_URL: "postgresql://app:secret@db:5432/community_day?serverVersion=15&charset=utf8"
      APP_ENV: dev
      APP_SECRET: hakaton2026secretkey
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: "community_day_jwt"
      CORS_ALLOW_ORIGIN: "http://localhost:5173"
      MAILER_DSN: "smtp://mailpit:1025"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
